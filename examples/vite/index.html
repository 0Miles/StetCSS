<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StetCSS in Vite</title>
</head>

<body>
  <div id="app">
    <div>
      <div class="flex justify-center items-center">
        <a href="https://vitejs.dev" target="_blank">
          <img src="/vite.svg" class="logo" alt="Vite logo" />
        </a>
        <a href="https://github.com/0Miles/StetCSS" target="_blank">
          <img src="/logo.svg" class="logo size:10rem!" alt="Logo" />
        </a>
      </div>
      <h1
        class="font:sans tracking:tight fg:white@dark font:heavy">
        <span class="text-gradient bg:linear-gradient(120deg,#bd34fe|30%,#41d1ff)">Vite</span>
        <span class="fg:slate-70 mx:10px font:medium">+</span>
        <span class="fg:primary">StetCSS</span>
      </h1>
      <div class="card">
        <button id="counter" type="button" class="fg:white@dark"></button>
      </div>
      <p class="read-the-docs">
        Click on the logos to learn more

  </div>
  <script type="module" src="src/main.ts"></script>
