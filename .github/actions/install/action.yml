name: Install dependencies
description: >-
  Set up Node and Bun, install dependencies from bun.lock, and fail when
  `bun pm untrusted` lists packages whose lifecycle scripts were blocked.

inputs:
  install-flags:
    description: >-
      Extra flags for `bun install`, separated by spaces, such as the --os,
      --cpu and --libc flags that install other platforms' native packages.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # Bun does not enforce packageManager, so CI installs the version it names.
    - uses: oven-sh/setup-bun@v2
      id: bun
      with:
        bun-version-file: package.json

    - name: Show toolchain versions
      shell: bash
      run: |
        echo "node $(node --version)"
        echo "bun $(bun --version)"

    # Different install flags fill the cache with different packages, so the
    # flags are part of the key. The brackets keep one job's restore prefix
    # from matching another job's keys.
    - name: Cache Bun packages
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-flags[${{ inputs.install-flags }}]-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-flags[${{ inputs.install-flags }}]-

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_FLAGS: ${{ inputs.install-flags }}
      # Unquoted on purpose: word splitting passes each flag as its own argument.
      run: bun install --frozen-lockfile $INSTALL_FLAGS

    # `bun pm untrusted` exits 0 even when it lists packages, so judge its output.
    - name: Reject dependencies with blocked lifecycle scripts
      shell: bash
      run: |
        output=$(bun pm untrusted 2>&1) || { echo "$output"; exit 1; }
        echo "$output"
        if ! grep -qxF 'Found 0 untrusted dependencies with scripts.' <<< "$output"; then
          echo "::error::bun pm untrusted listed packages whose lifecycle scripts were blocked. Review them and add the trusted ones to trustedDependencies in package.json."
          exit 1
        fi
