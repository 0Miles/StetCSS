name: Release Please

# Opens or updates the release PR that bumps every published @stet-css/*
# package to one shared version and writes their changelogs. Once the release
# PR is merged, the next run creates one GitHub release and tag per package
# (`core-v0.1.0`, ...), and the `pack` and `publish` jobs then put that
# release on npm. That run fails when any package's tag or GitHub release is
# missing, but still publishes.
#
# Repository settings this workflow reads (set by a maintainer):
# - variable RELEASE_PLEASE_ENABLED: the release-please job runs only when it
#   is `true`, so main gets no failed runs before Actions may create pull
#   requests.
# - Actions may create pull requests (Settings > Actions > General).
#
# Everything runs on GITHUB_TOKEN; no personal token is stored. The release
# PR is opened by github-actions[bot], so its pull_request CI run waits for a
# maintainer to approve it ("Approve and run workflows" on the PR) after every
# update. Check runs from a workflow_dispatch run on the same commit do not
# count toward the PR's `required`, so dispatching CI from here does not help.
# - variable NPM_PUBLISH_ENABLED: nothing is packed or published unless it is
#   `true`. Leave it unset until the first publish.
# - secret NPM_TOKEN (optional): npm lets a package trust this workflow only
#   after the package exists, so the first publish needs a granular token.
#   Later publishes authenticate through trusted publishing (OIDC): each
#   package on npm trusts `0Miles/StetCSS`, workflow `release-please.yml`.
#   Renaming this file breaks that trust.

on:
  push:
    branches: [main]
  # Finishes a publish that stopped halfway, when rerunning the failed job is
  # no longer possible. Versions already on npm are skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to npm, such as core-v0.1.0
        required: true
        type: string

permissions:
  contents: read

# Each run rewrites the same release PR branch; let one finish before the next.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # The 28 packages share one version and one release commit, so the tag
      # of any package released in this run names the commit to publish. Not
      # a fixed package: a run that finishes releases an earlier, failed run
      # left behind creates only the remaining ones.
      tag: ${{ steps.release.outputs[format('{0}--tag_name', fromJSON(steps.release.outputs.paths_released || '[]')[0])] }}
    steps:
      - name: Open or update the release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # bun.lock records each workspace's version, and release-please does
      # not know the file. Bun 1.4.4's `--frozen-lockfile` lets that drift
      # pass, but the next plain `bun install` rewrites bun.lock, leaving
      # every contributor an unrelated diff. Rewrite it on the PR branch.
      # release-please force-pushes that branch whenever it updates the PR,
      # so this runs on every run that returns a PR.
      - name: Check out the release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ github.token }}

      - name: Set up Bun
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # --lockfile-only resolves without downloading packages or running
      # lifecycle scripts; only the workspace versions change.
      - name: Sync bun.lock with the release versions
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          bun install --lockfile-only --ignore-scripts
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches the release versions"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: sync bun.lock with the release versions'
          git push origin "HEAD:refs/heads/$BRANCH"

      # release-please has created only some packages' tags and releases
      # without failing (0.1.0 to 0.3.0). After a run that created releases,
      # list every package whose tag or GitHub release is missing and turn the
      # run red. These steps come last, so a failure here skips nothing in this
      # job, and !cancelled() runs them even when the bun.lock sync failed.
      # They do not stop npm: `pack` runs on releases_created whatever this
      # job's result. When this job is red, recover a failed publish by
      # rerunning the publish job alone: "Re-run failed jobs" would rerun this
      # job too, which then creates no release and skips pack and publish.
      # The checkout is the commit this run was started for,
      # whose manifest holds the version just released, in its own directory
      # so it leaves the release PR branch checkout alone.
      - name: Check out the release check
        if: ${{ !cancelled() && steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tag-check
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .release-please-manifest.json
            release-please-config.json
            scripts/check-release-tags.mjs
            scripts/release-tags.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node for the release check
        if: ${{ !cancelled() && steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: release-tag-check/.nvmrc

      - name: Check every package has its tag and GitHub release
        if: ${{ !cancelled() && steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node release-tag-check/scripts/check-release-tags.mjs

  # Builds the released commit and packs the tarballs. Dependencies are
  # installed and built here, in a job that cannot publish.
  pack:
    name: pack
    needs: release-please
    # !cancelled() lets a manual run through, where release-please is skipped.
    if: >-
      ${{
        !cancelled() &&
        vars.NPM_PUBLISH_ENABLED == 'true' &&
        (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    outputs:
      tag: ${{ env.RELEASE_TAG }}
    steps:
      # A manual run from another branch would publish with that branch's
      # copy of this workflow.
      - name: Require a release tag and the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Start this workflow from $DEFAULT_BRANCH, not $GITHUB_REF."
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release-please created releases but reported no tag. Start this workflow by hand with the release tag, such as core-v0.1.0."
            exit 1
          fi

      # The tag, not the pushed commit: by the time this run creates the
      # releases, main may already be ahead of the release commit.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up toolchain and install dependencies
        uses: ./.github/actions/install

      - name: Check release manifest
        run: bun run check:release

      # Builds, then inspects the same tarballs the next step packs.
      - name: Check package contents
        run: bun run check:packages

      - name: Pack the released packages
        run: node scripts/publish-packages.mjs pack --tag "$RELEASE_TAG" --out "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          # Rerunning the publish job alone works while this lasts.
          retention-days: 7

  # Uploads the tarballs with npm, because `bun publish` (1.4.4) supports
  # neither trusted publishing nor provenance. It is the only job that can
  # mint an npm identity, and it runs nothing from node_modules.
  publish:
    name: publish
    needs: pack
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.pack.outputs.tag }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/publish-packages.mjs
          sparse-checkout-cone-mode: false

      # registry-url writes the .npmrc that npm's OIDC exchange and the
      # NPM_TOKEN fallback both authenticate through.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs

      # Dependency order, skipping versions npm already has; a failure stops
      # here and a rerun publishes the rest.
      # NPM_TOKEN is empty unless the secret exists; the script passes it to
      # npm as NODE_AUTH_TOKEN only then, so trusted publishing runs with the
      # .npmrc exactly as setup-node left it.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ needs.pack.outputs.tag }}
        run: node scripts/publish-packages.mjs publish --tag "$RELEASE_TAG" --dir "$RUNNER_TEMP/tarballs"
