name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up toolchain and install dependencies
        uses: ./.github/actions/install

      # From here on each step runs even if an earlier one failed,
      # so one run reports every failing suite.

      # Browser builds are per OS image, so the key carries the image as well as the version.
      - name: Resolve Playwright cache key
        id: playwright
        if: ${{ !cancelled() }}
        run: echo "key=$ImageOS-playwright-$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}

      # Runtime e2e runs in Firefox; the vite and webpack tests in check and
      # the next e2e launch Chromium.
      - name: Install Playwright browsers
        if: ${{ !cancelled() }}
        run: bun x --no-install playwright install --with-deps --only-shell chromium firefox

      - name: Check
        if: ${{ !cancelled() }}
        run: bun run check -- --continue

      # The release-please config and manifest must list exactly the
      # published @stet-css/* packages, at the version their package.json has.
      - name: Check release manifest
        if: ${{ !cancelled() }}
        run: bun run check:release

      # No file path or text may still use the upstream product name outside
      # the reasoned allowlist in the script (upstream references, the removed
      # @master at-rule, old-name guard tests, third-party names).
      - name: Check naming
        if: ${{ !cancelled() }}
        run: bun run check:naming

      # Packs every published package with bun (the publish tool, which rewrites
      # workspace:^) and checks the tarballs: entry points present, no local
      # dependency protocols, repository metadata pointing at this repo.
      - name: Check package contents
        if: ${{ !cancelled() }}
        run: bun run check:packages

      - name: Build examples
        if: ${{ !cancelled() }}
        run: bun run build:examples -- --continue

      - name: E2E
        if: ${{ !cancelled() }}
        run: bun run e2e

  # A plain install only fetches this runner's native packages, so the VS Code
  # packaging test for win32-x64 would skip. This job installs every
  # platform's and runs only the VS Code extension's tests.
  all-platforms:
    name: all-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Listed explicitly because `*` would also fetch packages for platforms
      # the extension does not ship.
      - name: Set up toolchain and install dependencies
        uses: ./.github/actions/install
        with:
          install-flags: --os=win32 --os=darwin --os=linux --cpu=x64 --cpu=arm64 --cpu=arm --libc=glibc --libc=musl

      # Runs even if the untrusted check failed, so one run reports both.
      # turbo builds the extension's dependencies first; --reporter=verbose
      # reaches only the vitest run and logs each test's result.
      - name: Test the VS Code extension
        if: ${{ !cancelled() }}
        run: node scripts/with-typescript-tooling-compat.mjs node_modules/.bin/turbo run test --filter=stet-css-vscode -- --reporter=verbose

      # The win32-x64 test skips instead of failing when that target's native
      # packages are missing, so a green test step does not prove the install
      # covered every target. This is the check release.js runs before
      # packaging. It needs the build from the step above, so it runs only
      # when every earlier step passed; after a failed build it would blame
      # the install.
      - name: Require native packages for every VS Code target
        run: node --input-type=module -e "const core = await import('./packages/vscode/scripts/package-target-core.js'); core.assertRuntimePackagesResolvable(core.TARGETS)"

  # Release notes are parsed as HTML, so a tag-like <style> in a PR title,
  # commit subject or BREAKING CHANGE text makes release-please release only
  # some packages (#279). On a PR this checks the title and base..head; on a
  # push to main it checks the pushed commits, because a skipped job would
  # fail required.
  commit-text:
    name: commit-text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The title is read from the API rather than the event, so rerunning
      # the job after editing the title checks the new one.
      - name: Reject HTML-like tags in the PR title and commit text
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)
            node scripts/check-commit-text.mjs "$BASE..$HEAD" --title "$title"
          elif git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/check-commit-text.mjs "$BASE..$HEAD"
          else
            # A force push can leave the old tip unreachable: check the new tip alone.
            node scripts/check-commit-text.mjs "$HEAD^!"
          fi

  # The only check branch protection requires. It also fails when a job is
  # missing from `needs`, because a job it does not wait for could fail
  # without blocking the merge. Keep `if: always()`: without it a failed job
  # makes required skip, and a skipped required check counts as passing.
  required:
    name: required
    needs: [checks, all-platforms, commit-text]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      - name: Require every job to be in needs and to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          workflow_jobs=$(yq -o=json '.jobs | keys' .github/workflows/ci.yml)
          echo "jobs in ci.yml: $(jq -r 'join(" ")' <<< "$workflow_jobs")"
          unlisted=$(jq -r --arg self "$GITHUB_JOB" --argjson needs "$NEEDS" '.[] | select(. != $self and (. as $job | $needs | has($job) | not))' <<< "$workflow_jobs")
          if [ -n "$unlisted" ]; then
            echo "::error::required does not wait for these jobs; add them to its needs: ${unlisted//$'\n'/ }"
            exit 1
          fi
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
