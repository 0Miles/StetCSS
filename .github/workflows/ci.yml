name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      # From here on each step runs even if an earlier one failed,
      # so one run reports every failing suite.

      # Browser builds are per OS image, so the key carries the image as well as the version.
      - name: Resolve Playwright cache key
        id: playwright
        if: ${{ !cancelled() }}
        run: echo "key=$ImageOS-playwright-$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}

      # Runtime e2e runs in Firefox; the vite and webpack tests in check and
      # the next e2e launch Chromium.
      - name: Install Playwright browsers
        if: ${{ !cancelled() }}
        run: bun x --no-install playwright install --with-deps --only-shell chromium firefox

      - name: Check
        if: ${{ !cancelled() }}
        run: bun run check -- --continue

      - name: Build examples
        if: ${{ !cancelled() }}
        run: bun run build:examples -- --continue

      - name: E2E
        if: ${{ !cancelled() }}
        run: bun run e2e

  # The only check branch protection requires; list every job in `needs`.
  required:
    name: required
    needs: [checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
